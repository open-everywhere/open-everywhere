# Open Everywhere egress proxy — TIER B (opt-in MITM) overlay.
#
# Dropped into /etc/squid/conf.d/ by entrypoint.sh ONLY when OE_EGRESS_MITM=1. It makes
# Squid terminate TLS with the locally-generated CA (deploy/egress-proxy/ca, installed into
# the sandbox/guest trust store by gen-ca.sh) so that:
#   1. the decrypted request's method + path can be narrowed by the compiled policy, and
#   2. a Tier B credential header (the git read-broker Authorization) can be injected at the
#      firewall — full parity with Vercel's transform.headers, secret never in-sandbox.
#
# ⚠ CLIENT COMPAT (see README): MITM only works for clients that (a) honor the proxy env
# (HTTPS_PROXY) and (b) trust the local CA. git/npm/curl do once the CA is installed and
# their proxy env is set; some tools pin certificates or bypass the proxy — those break
# under Tier B and must be allow-listed for Tier A splice instead.

# Bump listener — the CA cert+key generated by gen-ca.sh.
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
tls_outgoing_options options=NO_SSLv3

# Peek at the ClientHello (to read SNI for the ACL), then bump (decrypt) allowed hosts.
acl step1 at_step SslBump1
# THE HOST PLANE IS SPLICED AT STEP 1, never peeked or bumped (OPE-2406). The app's own model
# call carries Proxy-Authorization on the CONNECT only. After a peek, Squid re-checks a fake
# CONNECT built from the SNI, and a bumped inner request is a new request: neither carries the
# header, so the control service would decide it against the SESSION policy and deny the model
# call. `oe_proxy_cred` matches only a `Bearer <value>` header, and `oe_allowed` then passes only
# the valid token to a host-plane host. A missing header, or a literal `-` (which the control
# service reads as "no credential", the session shape), never matches, so a session request is
# peeked and bumped as before and cannot dodge Tier B's method/path narrowing by this rule.
acl oe_proxy_cred req_header Proxy-Authorization ^Bearer[[:space:]]+[^[:space:]]
ssl_bump splice step1 oe_proxy_cred oe_allowed
ssl_bump peek step1
ssl_bump bump oe_allowed
ssl_bump terminate all

# Inject the Tier B credential header the helper returned as the `authz` annotation.
# Only stamped when the ACL matched AND returned a header (the git read-broker path).
# The helper's `OK authz="…"` becomes a transaction note read here as %note{authz}
# (Squid 7 dropped %external_acl_message for request_header_add). The leading `'` is the
# LOG_QUOTE_NONE modifier — WITHOUT it Squid URL-encodes the note, turning the mandatory
# space in `Basic <base64>` / `Bearer <jwt>` into %20 and corrupting every real credential.
acl oe_has_authz note authz
request_header_add Authorization "%'note{authz}" oe_has_authz
