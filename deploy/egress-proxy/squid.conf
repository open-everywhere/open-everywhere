# Open Everywhere egress proxy — Squid base config.
#
# TIER A (default, NO MITM): a forward proxy that allows/denies each CONNECT (and plain
# HTTP) request by destination host, decided live by the control service via an
# external_acl callout. TLS is never decrypted — the raw bytes are tunnelled once the host
# passes (peek-and-splice semantics fall out of a plain CONNECT tunnel: Squid sees the
# CONNECT authority in cleartext and never terminates TLS). This restores the default-deny
# exfiltration backstop on justbash/docker without KVM.
#
# TIER B (opt-in, MITM) lives in conf.d/tier-b.conf, dropped in by entrypoint.sh only when
# OE_EGRESS_MITM=1. It ssl_bumps with a local CA so the decrypted request's method/path can
# be narrowed and a credential header injected.
#
# NB the exact external_acl format codes below (%SRC %DST %METHOD %PATH) are the widely
# supported named tokens; if your Squid build differs, adjust in one place here. See
# deploy/egress-proxy/README.md.

# Forward-proxy listener the app points HTTPS_PROXY/HTTP_PROXY at.
http_port 3128

# ── The live policy ACL: one callout per request to the control service (helper.js) ──
# ttl=0 → never cache a decision (the policy changes mid-turn via the git broker).
# %>{Proxy-Authorization} names the PRINCIPAL (OPE-2406). The app's own model call carries
# `Bearer <OE_EGRESS_PROXY_TOKEN>` and is decided against the app's host-plane allow list. A
# request without it is a session request, decided against the session policy for its source
# IP. Squid consumes the header here and does not forward it to the origin. No auth_param is
# configured, so Squid never answers 407 and an uncredentialed request is not challenged.
external_acl_type oe_egress ttl=0 negative_ttl=0 grace=0 concurrency=64 children-max=8 children-startup=1 \
  %SRC %DST %METHOD %PATH %>{Proxy-Authorization} \
  /usr/bin/node /opt/oe-egress/control/helper.js
acl oe_allowed external oe_egress

# ── Standard safety ACLs ──
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# ── The one allow rule: the control-service policy. Everything else is denied. ──
http_access allow oe_allowed
http_access deny all

# Policy gateway, not a cache.
cache deny all
via off
forwarded_for delete

# Squid drops privileges to the `squid` user. It logs to the container's stdout/stderr
# (below); the entrypoint chowns those pipes to `squid` so the non-root worker can open them
# (Squid 7 FATALs on `cache_effective_user root`, so dropping privileges is mandatory).

# Logs to the container's stdout/stderr for `docker logs`.
logfile_rotate 0
access_log stdio:/dev/stdout squid

# ── THE DENIAL LOG (OPE-314) — the ONE file the app is allowed to read ────────────────────────
# The app tails this to turn policy denials into `egress.denied` audit rows, which is what lets
# the permission-homeostasis widening loop see this plane at all (before OPE-314 an individual
# blocked request left no record anywhere — see packages/core/agent/access/egress-denial-log.ts).
#
# 🔴 THE MINIMISATION HAPPENS HERE, AT THE SOURCE, not only in the reader. The `squid` format
# above carries the full request URL, and under Tier B (MITM) Squid has DECRYPTED the request, so
# that URL includes the path AND the query string — the single most likely place for a token, an
# object id or a person's email to be sitting. This format carries three fields and no more:
#   %ts.%03tu   when         (unix seconds + ms)
#   %Ss/%03>Hs  what Squid decided  (e.g. TCP_DENIED/403 — the reader keys on the `_DENIED` tag)
#   %>rd        the DOMAIN   (request URL domain — no scheme, no port, no path, no query)
# No client address, no method, no bytes, no user. The reader re-derives the host defensively
# anyway (it must also cope with an operator pointing it at a conventional access.log), but this
# line is why the bytes on the shared volume never contain a path in the first place.
#
# The `http_status 403` ACL is what narrows the file to refusals; a Squid ACL cannot match on %Ss.
# That is imprecise in one direction only — under Tier B an ORIGIN's own 403 also lands here as
# `TCP_MISS/403` — and the reader discards those, because only a `_DENIED` tag is OUR refusal.
#
# The directory is created by entrypoint.sh whether or not a volume is mounted over it, so Squid
# can never FATAL on an unopenable access_log; unmounted, the file simply stays inside the
# container and nothing reads it.
logformat oe_deny %ts.%03tu %Ss/%03>Hs %>rd
acl oe_deny_status http_status 403
access_log stdio:/var/log/oe-egress/denied.log oe_deny oe_deny_status
# cache_log (debug) also to stdout — the non-root `squid` user reliably reopens the chowned
# /dev/stdout pipe; /dev/stderr is flakier under Docker, and interleaving both on stdout is
# the conventional container pattern (`docker logs` captures it either way).
cache_log stdio:/dev/stdout
pid_filename /tmp/squid.pid

# Tier B (MITM) directives, if enabled, are APPENDED to this file by entrypoint.sh when
# OE_EGRESS_MITM=1 (not via an `include` glob — Squid 6.x treats a conf.d/*.conf glob that
# matches zero files as a FATAL error, which is exactly the Tier A case).
