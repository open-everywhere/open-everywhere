name: 🐞 Bug report
description: Something isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security vulnerabilities, do not use this form** — see [SECURITY.md](../../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I @mention the agent in a private channel, it…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest reproduction you can.
      placeholder: |
        1. Deploy with …
        2. In Slack, …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: deploy-target
    attributes:
      label: Deploy target
      options:
        - Vercel (managed)
        - Self-host (Node / Nitro)
        - Local (eve dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Slack
        - Microsoft Teams
        - Discord
        - Linear
        - Not surface-specific
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model / provider
      description: e.g. GLM-5.2 via Vercel AI Gateway → Fireworks (default), or your override.
      placeholder: zai/glm-5.2 (default)
  - type: input
    id: memory-provider
    attributes:
      label: Memory & operational provider
      description: OE_MEMORY_PROVIDER / OE_OPERATIONAL_PROVIDER values.
      placeholder: postgres / postgres
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. **Redact secrets, tokens, and PII.**
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
