name: 💡 Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the underlying need, not just a proposed solution — it helps us find the best fit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Sketch the shape if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new surface / chat platform
        - A new connector
        - Memory / identity / access
        - Proactivity (routines)
        - Deploy / self-host
        - Admin / control plane
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues/discussions and this isn't a duplicate
          required: true
